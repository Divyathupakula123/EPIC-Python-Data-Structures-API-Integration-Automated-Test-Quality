name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v Day4_Pytest_CI/test_pytest_ci.py Day5_Data_Processing_Capstone/tests --import-mode=importlib
        env:
        PYTHONPATH: ${{ github.workspace }}/Day5_Data_Processing_Capstone

