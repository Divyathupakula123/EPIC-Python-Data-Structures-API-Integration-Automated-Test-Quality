name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest
      - name: Install Final Mini Project dependencies
        run: python -m pip install -r Final_Mini_Project/requirements.txt

      - name: Run Day 4 tests
        run: python -m pytest -v Day4_Pytest_CI

      - name: Run Day 5 tests
        working-directory: Day5_Data_Processing_Capstone
        run: python -m pytest -v tests

      - name: Run Final Mini Project tests
        working-directory: Final_Mini_Project
        env:
          PYTHONPATH: .
        run: python -m pytest -v tests